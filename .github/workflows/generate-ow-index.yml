name: Generate OW PDF Directory Index

on:
  push:
    branches:
      - main     
    paths:
      - 'OWs/**' 
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code Layers
      uses: actions/checkout@v4

    - name: Scan Directory and Build Static File Matrix
      run: |
        cd OWs
        echo "Scanning files inside the /OWs directory..."
        
        # FIXED: Lists files, filters for PDFs, and programmatically appends your direct GitHub Pages link schema to each file entry
        ls -1 | grep -i '\.pdf$' | jq -R --arg base "https://TheCathedralFCCLA.github.io/OW/OWs/" '$base + .' | jq -s . > index.json
        
        echo "Index file tracking grid compiled successfully with absolute web URLs:"
        cat index.json

    - name: Commit and Sync Directory Manifest to Main Track
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add OWs/index.json
        
        if git diff --staged --quiet; then
          echo "No layout modifications or new asset paths detected. Skipping sync."
        else
          git commit -m "chore: automated directory matrix update [skip ci]"
          git push origin main
        fi