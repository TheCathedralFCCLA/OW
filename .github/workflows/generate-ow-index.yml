name: Generate OW PDF Directory Index

on:
  push:
    branches:
      - main     
    paths:
      - 'OWs/**' 
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code Layers
      uses: actions/checkout@v4

    - name: Scan Directory and Build Comprehensive JSON Database
      run: |
        npm install || true
        node scripts/generate-ow-index.js

    - name: Commit and Sync Directory Manifest to Main Track
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add OWs/index.json
        
        if git diff --staged --quiet; then
          echo "No layout modifications or new asset paths detected. Skipping sync."
        else
          git commit -m "chore: automated directory matrix update [skip ci]"
          git push origin main
        fi