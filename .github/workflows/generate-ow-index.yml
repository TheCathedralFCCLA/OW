name: Generate OW PDF Directory Index

on:
  push:
    branches:
      - main     
    paths:
      - 'OWs/**' 
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code Layers
      uses: actions/checkout@v4

    - name: Scan Directory and Build Comprehensive JSON Database
      run: |
        cd OWs
        echo "Scanning files inside the /OWs directory..."
        
        # Compiles an advanced key-value relational map of dates to filenames and absolute URLs
        ls -1 | grep -i '\.pdf$' | jq -R -s '
          split("\n") | map(select(length > 0)) | map(
            capture("^(?<m>[0-9]{1,2})[-.](?<d>[0-9]{1,2})[-.](?<y>[0-9]{2,4})(?<tail>.*)$") |
            .m = (.m | tonumber | tostring) |
            .d = (.d | tonumber | tostring) |
            .y = (if (.y | tonumber) > 1000 then (.y | tonumber) % 100 | tostring else .y end) |
            {
              "key": "\(.m)-\(.d)-\(.y)",
              "value": {
                "filename": "\(.m).\(.d).\(.y)\(.tail)",
                "url": "https://cju-media.github.io/OW/OWs/\(.m).\(.d).\(.y)\(.tail | @uri)",
                "display_date": "\(.m)/\(.d)/\(.y)"
              }
            }
          ) | from_entries
        ' > index.json
        
        echo "Master dynamic database map compiled successfully:"
        cat index.json

    - name: Commit and Sync Directory Manifest to Main Track
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add OWs/index.json
        
        if git diff --staged --quiet; then
          echo "No layout modifications or new asset paths detected. Skipping sync."
        else
          git commit -m "chore: automated directory matrix update [skip ci]"
          git push origin main
        fi