<!DOCTYPE html>
<html>
<head>
    <title>Opening Latest PDF...</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #666; }
    </style>
</head>
<body>
    <div>Opening Latest OW...</div>

    <script>
        const USER = 'TheCathedralFCCLA';
        const REPO = 'OW';

        async function redirectToLatestPDF() {
            try {
                // We fetch the contents of the repo
                const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/`);
                const files = await response.json();

                // 1. Filter for only PDF files
                // 2. Sort them. By default, GitHub returns them alphabetically.
                // If your files are named by date (e.g. 2024.pdf, 2023.pdf), 
                // .sort().reverse() will put the newest at the top.
                const pdfFiles = files
                    .filter(file => file.name.toLowerCase().endsWith('.pdf'))
                    .sort((a, b) => b.name.localeCompare(a.name)); 

                if (pdfFiles.length > 0) {
                    // Pick the first one after sorting
                    const latestPdf = pdfFiles[0];
                    
                    // Redirect to the GitHub Pages URL
                    const pdfUrl = `https://${USER}.github.io/${REPO}/${latestPdf.name}`;
                    window.location.replace(pdfUrl);
                } else {
                    document.body.innerText = 'No PDF file found.';
                }
            } catch (error) {
                document.body.innerText = 'Error loading PDF.';
                console.error(error);
            }
        }

        redirectToLatestPDF();
    </script>
</body>
</html>
