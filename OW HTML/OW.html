<!DOCTYPE html>
<html>
<head>
    <title>OW Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            background-color: #f9f9f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            padding-bottom: 60px !important; 
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }
        #top-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 15px;
            background: #fff;
            border-bottom: 1px solid #eee;
            text-align: center;
        }
        #top-bar h1 {
            margin: 0 !important;
            padding: 0 !important;
            font-size: 26px;
        }
        .ow-selector-inline {
            margin: 2px 0 4px 0;
        }
        .ow-dropdown-style {
            padding: 6px 12px;
            font-size: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-family: inherit;
            cursor: pointer;
            background-color: #fff;
        }
        #status-bar {
            color: #666;
            font-size: 14px;
        }
        .ow-actions-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }
        .btn {
            display: inline-block;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn:hover {
            background: #f5f5f5;
            border-color: #999;
        }
        .btn-primary {
            color: #fff;
            background: #cc0000;
            border-color: #b30000;
        }
        .btn-primary:hover {
            background: #b30000;
            border-color: #990000;
        }
        iframe {
            width: 100%;
            height: 900px;
            border: none;
            margin: 0;
            padding: 0;
        }
        
        @media (max-width: 767px) {
            iframe {
                height: 650px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Layout Section -->
        <div id="top-bar">
            <h1>Order of Worship</h1>
            <div class="ow-selector-inline">
                <select id="ow-dropdown" class="ow-dropdown-style">
                    <option value="">Loading available editions...</option>
                </select>
            </div>
            <div id="status-bar" style="display: none;">Loading document framework...</div>
            
            <div class="ow-actions-wrapper">
                <a id="watch-service-btn" class="btn btn-primary" target="_blank" style="display: none;">Watch Service</a>
                <a id="open-new-tab-btn" class="btn" target="_blank">Open OW in New Tab</a>
            </div>
        </div>
        
        <!-- Document Canvas Frame -->
        <iframe id="ow-viewer" src="about:blank" allow="autoplay"></iframe>
    </div>

    <script>
        const USER = 'TheCathedralFCCLA';
        const REPO = 'OW';
        const SUBFOLDER = 'OWs';
        
        const REPO_DOCS_JSON = `https://${USER}.github.io/${REPO}/${SUBFOLDER}/index.json`;
        const GITHUB_API_URL = `https://api.github.com/repos/${USER}/${REPO}/contents/${SUBFOLDER}`;
        const YT_JSON_URL = 'https://raw.githubusercontent.com/cju-media/FCCLA-Youtube-Checker/main/data/playlist_streams.json';

        const viewerFrame = document.getElementById('ow-viewer');
        const statusBar = document.getElementById('status-bar');
        const watchBtn = document.getElementById('watch-service-btn');
        const openNewTabBtn = document.getElementById('open-new-tab-btn');
        const owDropdown = document.getElementById('ow-dropdown');

        function normalizeDate(m, d, y) {
            let month = parseInt(m, 10);
            let day = parseInt(d, 10);
            let year = parseInt(y, 10);
            if (year > 1000) year = year % 100;
            return { month, day, year };
        }

        // Helper to cleanly extract the plain filename from a complete URL link if needed
        function getFilenameFromEntry(entry) {
            if (entry.includes('/')) {
                return entry.substring(entry.lastIndexOf('/') + 1);
            }
            return entry;
        }

        function getTargetFilenameFromPath() {
            let dateSlug = null;

            if (window.location.protocol === 'file:') {
                const urlParams = new URLSearchParams(window.location.search);
                dateSlug = urlParams.get('date'); 
            } else {
                const path = window.location.pathname;
                const segments = path.split('/').filter(Boolean);
                const filteredSegments = segments.filter(seg => {
                    const lower = seg.toLowerCase();
                    return lower !== REPO.toLowerCase() && lower !== SUBFOLDER.toLowerCase();
                });
                if (filteredSegments.length > 0) {
                    dateSlug = filteredSegments[0];
                }
            }

            if (!dateSlug) return null;

            const dateRegex = /^(\d{1,2})-(\d{1,2})-(\d{2,4})$/;
            const match = dateSlug.match(dateRegex);

            if (match) {
                const norm = normalizeDate(match[1], match[2], match[3]);
                return `${norm.month}.${norm.day}.${norm.year} ow.pdf`;
            }
            return null; 
        }

        function sortFilesChronologically(pdfNames) {
            pdfNames.sort((a, b) => {
                const parseDateParts = (entry) => {
                    const name = getFilenameFromEntry(entry);
                    const parts = name.split(' ')[0].split('.');
                    return normalizeDate(parts[0] || 0, parts[1] || 0, parts[2] || 0);
                };
                const dateA = parseDateParts(a);
                const dateB = parseDateParts(b);

                if (dateA.year !== dateB.year) return dateB.year - dateA.year;
                if (dateA.month !== dateB.month) return dateB.month - dateA.month;
                return dateB.day - dateA.day;
            });
        }

        function extractDateFromFilename(filename) {
            const cleanPart = filename.split(/[\s_+]/)[0];
            const parts = cleanPart.split('.');
            if (parts.length >= 3) {
                return normalizeDate(parts[0], parts[1], parts[2]);
            }
            return null;
        }

        async function matchYoutubeVideo(pdfFilename) {
            watchBtn.style.display = 'none'; 
            const targetDate = extractDateFromFilename(pdfFilename);
            if (!targetDate) return;

            const pad = (num) => String(num).padStart(2, '0');
            const targetKey = `20${pad(targetDate.year)}${pad(targetDate.month)}${pad(targetDate.day)}`;

            console.log(`[YT Engine] Target Key generated for lookup query: "${targetKey}"`);

            try {
                const response = await fetch(`${YT_JSON_URL}?cb=${new Date().getTime()}`);
                const data = await response.json();
                
                if (data && data[targetKey] && Array.isArray(data[targetKey]) && data[targetKey].length > 0) {
                    const videoUrl = data[targetKey][0];
                    console.log(`[YT Engine] MATCH FOUND IN MAP MATRIX! Live URL string path: ${videoUrl}`);
                    
                    watchBtn.href = videoUrl;
                    watchBtn.style.display = 'inline-block';
                } else {
                    console.log(`[YT Engine] No tracking list links found registered under key value: "${targetKey}"`);
                }
            } catch (err) {
                console.warn('[YT Engine] Connection dropped or array layout parse mismatch:', err);
            }
        }

        function switchOW(fileName, cleanDatePart) {
            const targetPdfUrl = `https://${USER}.github.io/${REPO}/${SUBFOLDER}/${fileName}`;
            const urlSlug = cleanDatePart.replace(/\./g, '-');

            statusBar.style.display = 'none';
            viewerFrame.src = targetPdfUrl + '#view=Fit';
            openNewTabBtn.href = targetPdfUrl;

            if (window.location.protocol !== 'file:') {
                window.history.pushState(null, '', '/ows/' + urlSlug);
            }
            matchYoutubeVideo(fileName);
        }

        async function loadViewer() {
            const pathTargetFilename = getTargetFilenameFromPath();
            const cacheBuster = `?cb=${new Date().getTime()}`;
            let activeFile = null;
            let fileEntries = [];

            try {
                if (window.location.protocol === 'file:') {
                    console.log("[Directory Engine] Local session routing detected. Querying via open GitHub API tracking routes to prevent local CORS exceptions...");
                    const response = await fetch(`${GITHUB_API_URL}${cacheBuster}`);
                    const apiData = await response.json();
                    if (Array.isArray(apiData)) {
                        fileEntries = apiData.map(item => item.name);
                    }
                } else {
                    console.log("[Directory Engine] Live hosted web cluster detected. Routing lookup data through static index pipelines...");
                    const response = await fetch(`${REPO_DOCS_JSON}${cacheBuster}`);
                    fileEntries = await response.json();
                }

                if (Array.isArray(fileEntries)) {
                    // Filters the entry strings safely whether they contain full URLs or clean file titles
                    const pdfFiles = fileEntries.filter(entry => {
                        const lower = entry.toLowerCase();
                        return lower.endsWith('.pdf') && /\b\d{1,2}\.\d{1,2}\.\d{2,4}\b/.test(lower);
                    });
                    
                    sortFilesChronologically(pdfFiles);

                    if (pdfFiles.length > 0) {
                        owDropdown.innerHTML = '';
                        pdfFiles.forEach(entry => {
                            const filename = getFilenameFromEntry(entry);
                            const cleanDatePart = filename.split(/[\s_+]/)[0];
                            const labelDate = cleanDatePart.replace(/\./g, '/');
                            const option = document.createElement('option');
                            option.value = filename; // Stores the clean tracking filename value
                            option.setAttribute('data-date', cleanDatePart);
                            option.innerText = labelDate;
                            owDropdown.appendChild(option);
                        });

                        if (pathTargetFilename) {
                            const match = pdfFiles.find(entry => getFilenameFromEntry(entry).toLowerCase() === pathTargetFilename.toLowerCase());
                            activeFile = match ? getFilenameFromEntry(match) : getFilenameFromEntry(pdfFiles[0]);
                        } else {
                            activeFile = getFilenameFromEntry(pdfFiles[0]);
                        }

                        owDropdown.value = activeFile;
                    }
                }

                if (activeFile) {
                    const cleanDatePart = activeFile.split(/[\s_+]/)[0];
                    switchOW(activeFile, cleanDatePart);
                } else {
                    statusBar.innerText = 'No documents found.';
                    owDropdown.innerHTML = '<option value="">No archives available</option>';
                }

            } catch (error) {
                statusBar.innerText = 'Error loading document tracking directory list.';
                console.error(error);
            }
        }

        owDropdown.addEventListener('change', function(e) {
            const selectedFileName = e.target.value;
            if (!selectedFileName) return;

            const selectedOption = e.target.options[e.target.selectedIndex];
            const cleanDatePart = selectedOption.getAttribute('data-date');
            
            switchOW(selectedFileName, cleanDatePart);
        });

        loadViewer();
    </script>
</body>
</html>
