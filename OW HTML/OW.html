<div id="ow-embed-container" style="width:100%; display:flex; flex-direction:column; margin:0; padding:0; overflow:hidden;">
    
    <div id="ow-title-container" style="text-align:center; flex-shrink:0; padding-top:10px; padding-bottom:10px;">
        <h1>Order of Worship</h1>
        <h3 id="ow-dynamic-date">Loading Date...</h3>
    </div>

    <div id="ow-frame-wrapper" style="position:relative; width:100%; min-height:0; flex-grow:1;">
        <div id="ow-loading-status" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);">
            Loading OW Document Viewer...
        </div>
        <object id="dynamic-ow-viewer" type="application/pdf" style="width:100%; height:100%; display:none;"></object>
    </div>
</div>

<script>
    (function() {
        const embedContainer = document.getElementById('ow-embed-container');
        const frameWrapper = document.getElementById('ow-frame-wrapper');
        const titleContainer = document.getElementById('ow-title-container');
        const viewerObject = document.getElementById('dynamic-ow-viewer');
        const statusDiv = document.getElementById('ow-loading-status');
        const dateHeader = document.getElementById('ow-dynamic-date');
        
        const USER = 'TheCathedralFCCLA';
        const REPO = 'OW';
        const SUBFOLDER = 'OWs';

        // MAGIC FIX: Finds Squarespace's bloated outer containers and shrinks their massive padding down to zero
        function killSquarespaceWhitespace() {
            const blockSection = embedContainer.closest('.sqs-block-code, .code-block, .page-section, .content-wrapper');
            if (blockSection) {
                blockSection.style.paddingTop = '0px';
                blockSection.style.marginTop = '0px';
            }
            
            // Aggressively hunt upward for the immediate main content wrappers
            let parent = embedContainer.parentElement;
            while (parent && parent.tagName !== 'BODY') {
                if (parent.classList.contains('content-wrapper') || parent.classList.contains('sqs-layout')) {
                    parent.style.paddingTop = '0px';
                    parent.style.paddingBottom = '0px';
                }
                parent = parent.parentElement;
            }
        }

        function resizeViewer() {
            killSquarespaceWhitespace(); // Collapse whitespace checks on every window resize frame
            
            const windowHeight = window.innerHeight;
            const titleHeight = titleContainer.offsetHeight || 60;
            
            // Dynamically lock container math to remaining visual space
            const targetHeight = windowHeight - titleHeight - 20; 
            
            frameWrapper.style.height = targetHeight + 'px';
            embedContainer.style.height = windowHeight + 'px';
        }

        resizeViewer();
        window.addEventListener('resize', resizeViewer);

        function getOWCookie() {
            const name = "targetOWDate=";
            const decodedCookie = decodeURIComponent(document.cookie);
            const ca = decodedCookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i].trim();
                if (c.indexOf(name) === 0) {
                    return c.substring(name.length, c.length);
                }
            }
            return null;
        }

        function formatDisplayDate(rawDateString) {
            if (!rawDateString) return "";
            return rawDateString.replace(/-/g, '/');
        }

        function parseDateParts(name) {
            const match = name.trim().split(/[\s_+]/)[0].split('.');
            return {
                month: parseInt(match[0], 10) || 0,
                day: parseInt(match[1], 10) || 0,
                year: parseInt(match[2], 10) || 0
            };
        }

        function sortFilesChronologically(pdfFiles) {
            pdfFiles.sort((a, b) => {
                const dateA = parseDateParts(a.name);
                const dateB = parseDateParts(b.name);

                if (dateA.year !== dateB.year) return dateB.year - dateA.year;
                if (dateA.month !== dateB.month) return dateB.month - dateA.month;
                return dateB.day - dateA.day;
            });
        }

        async function loadViewer() {
            const savedDate = getOWCookie();
            const cacheBuster = `?cb=${new Date().getTime()}`;
            let targetPdfUrl = '';
            let finalDisplayDate = '';

            if (savedDate) {
                document.cookie = "targetOWDate=; max-age=0; path=/";
                window.history.pushState(null, '', '/ows/' + savedDate);
                finalDisplayDate = formatDisplayDate(savedDate);
            }

            try {
                const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${SUBFOLDER}${cacheBuster}`);
                const files = await response.json();

                if (Array.isArray(files)) {
                    const pdfFiles = files.filter(file => {
                        const name = file.name.toLowerCase();
                        return name.endsWith('.pdf') && /^\d{1,2}\.\d{1,2}\.\d{2,4}/.test(name);
                    });
                    
                    sortFilesChronologically(pdfFiles);

                    if (pdfFiles.length > 0) {
                        if (savedDate) {
                            const dateParts = savedDate.split('-');
                            const searchMonth = parseInt(dateParts[0], 10);
                            const searchDay = parseInt(dateParts[1], 10);
                            const searchYear = parseInt(dateParts[2].slice(-2), 10);

                            const matchedFile = pdfFiles.find(file => {
                                const fParts = parseDateParts(file.name);
                                return fParts.month === searchMonth && fParts.day === searchDay && fParts.year === searchYear;
                            });
                            
                            if (matchedFile) {
                                targetPdfUrl = `https://${USER}.github.io/${REPO}/${SUBFOLDER}/${matchedFile.name}`;
                            } else {
                                targetPdfUrl = `https://${USER}.github.io/${REPO}/${SUBFOLDER}/${pdfFiles[0].name}`;
                                const cleanDatePart = pdfFiles[0].name.split(/[\s_+]/)[0];
                                finalDisplayDate = cleanDatePart.replace(/\./g, '/');
                            }
                        } else {
                            targetPdfUrl = `https://${USER}.github.io/${REPO}/${SUBFOLDER}/${pdfFiles[0].name}`;
                            const cleanDatePart = pdfFiles[0].name.split(/[\s_+]/)[0];
                            finalDisplayDate = cleanDatePart.replace(/\./g, '/');
                        }
                    }
                }

                if (targetPdfUrl) {
                    dateHeader.innerText = finalDisplayDate;
                    viewerObject.data = targetPdfUrl + '#view=Fit';
                    
                    setTimeout(() => {
                        statusDiv.style.display = 'none';
                        viewerObject.style.display = 'block';
                        resizeViewer(); // Recalculate heights once layout maps
                    }, 300);
                } else {
                    dateHeader.innerText = "";
                    statusDiv.innerText = 'No Order of Worship documents found.';
                }

            } catch (error) {
                dateHeader.innerText = "Error";
                statusDiv.innerText = 'Error loading document viewer engine layers.';
                console.error(error);
            }
        }

        loadViewer();
    })();
</script>
