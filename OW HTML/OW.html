<!DOCTYPE html>
<html>
<head>
    <title>OW Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f9f9f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }
        #top-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 15px;
            background: #fff;
            border-bottom: 1px solid #eee;
            text-align: center;
        }
        #top-bar h1 {
            margin: 0 !important;
            padding: 0 !important;
            font-size: 26px;
        }
        .ow-selector-inline {
            margin: 2px 0 4px 0;
        }
        .ow-dropdown-style {
            padding: 6px 12px;
            font-size: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-family: inherit;
            cursor: pointer;
            background-color: #fff;
        }
        #status-bar {
            color: #666;
            font-size: 14px;
        }
        .btn {
            display: inline-block;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn:hover {
            background: #f5f5f5;
            border-color: #999;
        }
        .btn-primary {
            color: #fff;
            background: #cc0000;
            border-color: #b30000;
        }
        .btn-primary:hover {
            background: #b30000;
            border-color: #990000;
        }
        iframe {
            width: 100%;
            flex-grow: 1;
            border: none;
            margin: 0;
            padding: 0;
        }
        #bottom-bar {
            padding: 10px;
            background: #fff;
            border-top: 1px solid #eee;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Title and Dropdown Layout Area -->
        <div id="top-bar">
            <h1>Order of Worship</h1>
            <div class="ow-selector-inline">
                <select id="ow-dropdown" class="ow-dropdown-style">
                    <option value="">Loading available editions...</option>
                </select>
            </div>
            <div id="status-bar" style="display: none;">Loading document framework...</div>
            <a id="watch-service-btn" class="btn btn-primary" target="_blank" style="display: none;">Watch Service</a>
        </div>
        
        <!-- Interactive PDF viewer -->
        <iframe id="ow-viewer" src="about:blank" allow="autoplay"></iframe>

        <!-- Bottom Actions -->
        <div id="bottom-bar">
            <a id="open-new-tab-btn" class="btn" target="_blank">Open PDF in New Tab</a>
        </div>
    </div>

    <script>
        const USER = 'TheCathedralFCCLA';
        const REPO = 'OW';
        const SUBFOLDER = 'OWs';
        const YT_JSON_URL = 'https://raw.githubusercontent.com/cju-media/FCCLA-Youtube-Checker/main/data/playlist_streams.json';

        const viewerFrame = document.getElementById('ow-viewer');
        const statusBar = document.getElementById('status-bar');
        const watchBtn = document.getElementById('watch-service-btn');
        const openNewTabBtn = document.getElementById('open-new-tab-btn');
        const owDropdown = document.getElementById('ow-dropdown');

        function getTargetFilenameFromPath() {
            const path = window.location.pathname;
            const segments = path.split('/').filter(Boolean);
            
            const filteredSegments = segments.filter(seg => {
                const lower = seg.toLowerCase();
                return lower !== REPO.toLowerCase() && lower !== SUBFOLDER.toLowerCase();
            });

            if (filteredSegments.length === 0) return null; 

            const dateSlug = filteredSegments[0];
            const dateRegex = /^(\d{1,2})-(\d{1,2})-(\d{2,4})$/;
            const match = dateSlug.match(dateRegex);

            if (match) {
                let [_, month, day, year] = match;
                month = parseInt(month, 10).toString();
                day = parseInt(day, 10).toString();
                if (year.length === 4) year = year.slice(-2);
                return `${month}.${day}.${year} ow.pdf`;
            }
            return null; 
        }

        function sortFilesChronologically(pdfFiles) {
            pdfFiles.sort((a, b) => {
                const parseDateParts = (name) => {
                    const parts = name.split(' ')[0].split('.');
                    return {
                        month: parseInt(parts[0], 10) || 0,
                        day: parseInt(parts[1], 10) || 0,
                        year: parseInt(parts[2], 10) || 0
                    };
                };
                const dateA = parseDateParts(a.name);
                const dateB = parseDateParts(b.name);

                if (dateA.year !== dateB.year) return dateB.year - dateA.year;
                if (dateA.month !== dateB.month) return dateB.month - dateA.month;
                return dateB.day - dateA.day;
            });
        }

        function extractDateFromFilename(filename) {
            const cleanPart = filename.split(/[\s_+]/)[0];
            const parts = cleanPart.split('.');
            if (parts.length >= 3) {
                return {
                    month: parseInt(parts[0], 10),
                    day: parseInt(parts[1], 10),
                    year: parseInt(parts[2].slice(-2), 10)
                };
            }
            return null;
        }

        // Cross-references the selected PDF file's date with your playlist JSON log parameters
        async function matchYoutubeVideo(pdfFilename) {
            watchBtn.style.display = 'none'; // Hide by default while checking
            const targetDate = extractDateFromFilename(pdfFilename);
            if (!targetDate) return;

            try {
                const response = await fetch(`${YT_JSON_URL}?cb=${new Date().getTime()}`);
                const data = await response.json();
                
                const itemsList = data.items || (Array.isArray(data) ? data : []);
                
                const matchedItem = itemsList.find(item => {
                    const timeString = item.scheduledStartTime || item.publishedAt || (item.snippet ? item.snippet.publishedAt : null);
                    if (!timeString) return false;

                    const rawDatePart = timeString.split('T')[0]; 
                    const dateParts = rawDatePart.split(/[-/.]/);
                    
                    if (dateParts.length >= 3) {
                        let sMonth, sDay, sYear;
                        if (dateParts[0].length === 4) { // YYYY-MM-DD
                            sYear = parseInt(dateParts[0].slice(-2), 10);
                            sMonth = parseInt(dateParts[1], 10);
                            sDay = parseInt(dateParts[2], 10);
                        } else { // MM-DD-YY
                            sMonth = parseInt(dateParts[0], 10);
                            sDay = parseInt(dateParts[1], 10);
                            sYear = parseInt(dateParts[2].slice(-2), 10);
                        }
                        return sMonth === targetDate.month && sDay === targetDate.day && sYear === targetDate.year;
                    }
                    return false;
                });

                if (matchedItem) {
                    const videoId = matchedItem.video_id || matchedItem.id?.videoId || (typeof matchedItem.id === 'string' ? matchedItem.id : null);
                    if (videoId) {
                        watchBtn.href = `https://www.youtube.com/watch?v=${videoId}`;
                        watchBtn.style.display = 'inline-block';
                    }
                }
            } catch (err) {
                console.warn('YouTube cross-reference matching bypassed:', err);
            }
        }

        function switchOW(fileName, cleanDatePart) {
            const targetPdfUrl = `https://${USER}.github.io/${REPO}/${SUBFOLDER}/${fileName}`;
            const urlSlug = cleanDatePart.replace(/\./g, '-');

            statusBar.style.display = 'none';
            viewerFrame.src = targetPdfUrl + '#view=Fit';
            openNewTabBtn.href = targetPdfUrl;

            // Instantly sync the address bar URL without forcing an expensive window reload loop
            window.history.pushState(null, '', '/ows/' + urlSlug);

            // Run the async lookup engine to catch matching live streams
            matchYoutubeVideo(fileName);
        }

        async function loadViewer() {
            const pathTargetFilename = getTargetFilenameFromPath();
            const cacheBuster = `?cb=${new Date().getTime()}`;
            let activeFile = null;

            try {
                // Fetch the definitive collection of items from the subfolder path
                const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${SUBFOLDER}${cacheBuster}`);
                const files = await response.json();

                if (Array.isArray(files)) {
                    const pdfFiles = files.filter(file => {
                        const name = file.name.toLowerCase();
                        return name.endsWith('.pdf') && /^\d{1,2}\.\d{1,2}\.\d{2,4}/.test(name);
                    });
                    
                    sortFilesChronologically(pdfFiles);

                    if (pdfFiles.length > 0) {
                        // Re-render and rebuild option element arrays cleanly
                        owDropdown.innerHTML = '';
                        pdfFiles.forEach(file => {
                            const cleanDatePart = file.name.split(/[\s_+]/)[0];
                            const labelDate = cleanDatePart.replace(/\./g, '/');
                            const option = document.createElement('option');
                            option.value = file.name;
                            option.setAttribute('data-date', cleanDatePart);
                            option.innerText = labelDate;
                            owDropdown.appendChild(option);
                        });

                        // Set default selected option match criteria based on entry routes
                        if (pathTargetFilename) {
                            const match = pdfFiles.find(file => file.name.toLowerCase() === pathTargetFilename.toLowerCase());
                            activeFile = match || pdfFiles[0];
                        } else {
                            activeFile = pdfFiles[0];
                        }

                        owDropdown.value = activeFile.name;
                    }
                }

                if (activeFile) {
                    const cleanDatePart = activeFile.name.split(/[\s_+]/)[0];
                    switchOW(activeFile.name, cleanDatePart);
                } else {
                    statusBar.innerText = 'No documents found.';
                    owDropdown.innerHTML = '<option value="">No archives available</option>';
                }

            } catch (error) {
                statusBar.innerText = 'Error loading application data arrays.';
                console.error(error);
            }
        }

        // Handle selections chosen via manual interaction down the dropdown matrix chain
        owDropdown.addEventListener('change', function(e) {
            const selectedFileName = e.target.value;
            if (!selectedFileName) return;

            const selectedOption = e.target.options[e.target.selectedIndex];
            const cleanDatePart = selectedOption.getAttribute('data-date');
            
            switchOW(selectedFileName, cleanDatePart);
        });

        loadViewer();
    </script>
</body>
</html>
