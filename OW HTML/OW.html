<div id="ow-embed-container" style="width:100%; display:flex; flex-direction:column; margin:0; padding:0; overflow:hidden;">
    
    <div id="ow-title-container" style="text-align:center; flex-shrink:0;">
        <h1>Order of Worship</h1>
        <h3 id="ow-dynamic-date">Loading Date...</h3>
    </div>

    <div id="ow-frame-wrapper" style="position:relative; width:100%; min-height:0; flex-grow:1;">
        <div id="ow-loading-status" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);">
            Loading OW Document Viewer...
        </div>
        <object id="dynamic-ow-viewer" type="application/pdf" style="width:100%; height:100%; display:none;"></object>
    </div>

    <!-- Dropdown Selector Container Below PDF -->
    <div id="ow-selector-container" style="text-align:center; padding:15px; background:#f9f9f9; border-top:1px solid #eee; flex-shrink:0;">
        <label for="ow-dropdown" style="font-weight:bold; margin-right:10px;">Select an Order of Worship:</label>
        <select id="ow-dropdown" style="padding:8px 12px; font-size:16px; border-radius:4px; border:1px solid #ccc; max-width:100%;">
            <option value="">Loading historical list...</option>
        </select>
    </div>
</div>

<script>
    (function() {
        const embedContainer = document.getElementById('ow-embed-container');
        const frameWrapper = document.getElementById('ow-frame-wrapper');
        const titleContainer = document.getElementById('ow-title-container');
        const selectorContainer = document.getElementById('ow-selector-container');
        const viewerObject = document.getElementById('dynamic-ow-viewer');
        const statusDiv = document.getElementById('ow-loading-status');
        const dateHeader = document.getElementById('ow-dynamic-date');
        const owDropdown = document.getElementById('ow-dropdown');
        
        const USER = 'TheCathedralFCCLA';
        const REPO = 'OW';
        const SUBFOLDER = 'OWs';

        function resizeViewer() {
            const windowHeight = window.innerHeight;
            const titleHeight = titleContainer.offsetHeight || 80;
            const selectorHeight = selectorContainer.offsetHeight || 60;
            // Deduct both header and footer dropdown containers to prevent scrolling issues
            const targetHeight = windowHeight - titleHeight - selectorHeight - 20; 
            
            frameWrapper.style.height = targetHeight + 'px';
            embedContainer.style.height = windowHeight + 'px';
        }

        resizeViewer();
        window.addEventListener('resize', resizeViewer);

        function getOWCookie() {
            const name = "targetOWDate=";
            const decodedCookie = decodeURIComponent(document.cookie);
            const ca = decodedCookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i].trim();
                if (c.indexOf(name) === 0) {
                    return c.substring(name.length, c.length);
                }
            }
            return null;
        }

        function formatDisplayDate(rawDateString) {
            if (!rawDateString) return "";
            return rawDateString.replace(/-/g, '/');
        }

        function parseDateParts(name) {
            const match = name.trim().split(/[\s_+]/)[0].split('.');
            return {
                month: parseInt(match[0], 10) || 0,
                day: parseInt(match[1], 10) || 0,
                year: parseInt(match[2], 10) || 0
            };
        }

        function sortFilesChronologically(pdfFiles) {
            pdfFiles.sort((a, b) => {
                const dateA = parseDateParts(a.name);
                const dateB = parseDateParts(b.name);

                if (dateA.year !== dateB.year) return dateB.year - dateA.year;
                if (dateA.month !== dateB.month) return dateB.month - dateA.month;
                return dateB.day - dateA.day;
            });
        }

        // Helper to update url and switch pdf details uniformly
        function switchOW(fileName, cleanDatePart) {
            const targetPdfUrl = `https://${USER}.github.io/${REPO}/${SUBFOLDER}/${fileName}`;
            const finalDisplayDate = cleanDatePart.replace(/\./g, '/');
            const urlSlug = cleanDatePart.replace(/\./g, '-');

            dateHeader.innerText = finalDisplayDate;
            viewerObject.data = targetPdfUrl + '#view=Fit';
            
            // Updates URL bar dynamically without refreshing page
            window.history.pushState(null, '', '/ows/' + urlSlug);
        }

        // Main Execution Engine
        async function loadViewer() {
            const savedDate = getOWCookie();
            const cacheBuster = `?cb=${new Date().getTime()}`;
            let activeFile = null;
            let activeCleanDate = '';

            if (savedDate) {
                document.cookie = "targetOWDate=; max-age=0; path=/";
                window.history.pushState(null, '', '/ows/' + savedDate);
            }

            try {
                const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${SUBFOLDER}${cacheBuster}`);
                const files = await response.json();

                if (Array.isArray(files)) {
                    const pdfFiles = files.filter(file => {
                        const name = file.name.toLowerCase();
                        return name.endsWith('.pdf') && /^\d{1,2}\.\d{1,2}\.\d{2,4}/.test(name);
                    });
                    
                    sortFilesChronologically(pdfFiles);

                    if (pdfFiles.length > 0) {
                        // Populate Dropdown Menus
                        owDropdown.innerHTML = '';
                        pdfFiles.forEach(file => {
                            const cleanDatePart = file.name.split(/[\s_+]/)[0];
                            const labelDate = cleanDatePart.replace(/\./g, '/');
                            const option = document.createElement('option');
                            option.value = file.name;
                            option.setAttribute('data-date', cleanDatePart);
                            option.innerText = labelDate;
                            owDropdown.appendChild(option);
                        });

                        if (savedDate) {
                            const dateParts = savedDate.split('-');
                            const searchMonth = parseInt(dateParts[0], 10);
                            const searchDay = parseInt(dateParts[1], 10);
                            const searchYear = parseInt(dateParts[2].slice(-2), 10);

                            const matchedFile = pdfFiles.find(file => {
                                const fParts = parseDateParts(file.name);
                                return fParts.month === searchMonth && fParts.day === searchDay && fParts.year === searchYear;
                            });
                            
                            if (matchedFile) {
                                activeFile = matchedFile;
                                activeCleanDate = matchedFile.name.split(/[\s_+]/)[0];
                            } else {
                                activeFile = pdfFiles[0];
                                activeCleanDate = pdfFiles[0].name.split(/[\s_+]/)[0];
                            }
                        } else {
                            activeFile = pdfFiles[0];
                            activeCleanDate = pdfFiles[0].name.split(/[\s_+]/)[0];
                        }

                        // Set current selection item in dropdown element UI matching active state
                        owDropdown.value = activeFile.name;
                    }
                }

                if (activeFile) {
                    switchOW(activeFile.name, activeCleanDate);
                    
                    setTimeout(() => {
                        statusDiv.style.display = 'none';
                        viewerObject.style.display = 'block';
                        resizeViewer();
                    }, 300);
                } else {
                    dateHeader.innerText = "";
                    statusDiv.innerText = 'No Order of Worship documents found.';
                    owDropdown.innerHTML = '<option value="">No archives available</option>';
                }

            } catch (error) {
                dateHeader.innerText = "Error";
                statusDiv.innerText = 'Error loading document viewer engine layers.';
                console.error(error);
            }
        }

        // Attach Dropdown Event Handler Interaction Change Listener 
        owDropdown.addEventListener('change', function(e) {
            const selectedFileName = e.target.value;
            if (!selectedFileName) return;

            const selectedOption = e.target.options[e.target.selectedIndex];
            const cleanDatePart = selectedOption.getAttribute('data-date');
            
            // Temporarily mask view while rendering swapping elements smoothly
            viewerObject.style.display = 'none';
            statusDiv.style.display = 'block';
            statusDiv.innerText = 'Loading Selected OW Document...';

            switchOW(selectedFileName, cleanDatePart);

            setTimeout(() => {
                statusDiv.style.display = 'none';
                viewerObject.style.display = 'block';
                resizeViewer();
            }, 300);
        });

        loadViewer();
    })();
</script>
