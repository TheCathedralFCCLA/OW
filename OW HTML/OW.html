<!DOCTYPE html>
<html>
<head>
    <title>OW Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Inject PDF.js Core Engine Infrastructure via a stable, legacy-compatible production stream -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            background-color: #f9f9f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            padding-bottom: 60px !important; 
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }
        #top-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 15px;
            background: #fff;
            border-bottom: 1px solid #eee;
            text-align: center;
        }
        #top-bar h1 {
            margin: 0 !important;
            padding: 0 !important;
            font-size: 26px;
        }
        .ow-selector-inline {
            margin: 2px 0 4px 0;
        }
        .ow-dropdown-style {
            padding: 6px 12px;
            font-size: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-family: inherit;
            cursor: pointer;
            background-color: #fff;
        }
        #status-bar {
            color: #666;
            font-size: 14px;
        }
        .ow-actions-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }
        .btn {
            display: inline-block;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn:hover {
            background: #f5f5f5;
            border-color: #999;
        }
        .btn-primary {
            color: #fff;
            background: #cc0000;
            border-color: #b30000;
        }
        .btn-primary:hover {
            background: #b30000;
            border-color: #990000;
        }
        
        #mobile-pdf-deck {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            background: #f9f9f9;
            padding: 10px 0;
            box-sizing: border-box;
        }
        .mobile-pdf-page-canvas {
            width: 94% !important;
            height: auto !important;
            max-width: 650px;
            margin-bottom: 12px;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            border-radius: 4px;
        }
        #mobile-loader-msg {
            font-size: 15px;
            color: #666;
            padding: 40px 20px;
            text-align: center;
        }

        iframe {
            width: 100%;
            height: 900px;
            border: none;
            margin: 0;
            padding: 0;
        }
        
        @media (max-width: 767px) {
            iframe {
                display: none !important;
            }
            #mobile-pdf-deck {
                display: flex !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Layout Section -->
        <div id="top-bar">
            <h1>Order of Worship</h1>
            <div class="ow-selector-inline">
                <select id="ow-dropdown" class="ow-dropdown-style">
                    <option value="">Loading available editions...</option>
                </select>
            </div>
            <div id="status-bar" style="display: none;">Loading document framework...</div>
            
            <div class="ow-actions-wrapper">
                <a id="watch-service-btn" class="btn btn-primary" target="_blank" style="display: none;">Watch Service</a>
                <a id="open-new-tab-btn" class="btn" target="_blank">Open OW in New Tab</a>
            </div>
        </div>
        
        <!-- Mobile Custom Scrollable Canvas Container -->
        <div id="mobile-pdf-deck">
            <div id="mobile-loader-msg">Initializing digital reading layout...</div>
        </div>
        
        <!-- Desktop Document Canvas Frame -->
        <iframe id="ow-viewer" src="about:blank" allow="autoplay"></iframe>
    </div>

    <script>
        // CRITICAL FIX: Force PDF.js to completely skip thread spawning and run execution directly on the main thread
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = ''; 

        const USER = 'TheCathedralFCCLA';
        const REPO = 'OW';
        const SUBFOLDER = 'OWs';
        
        const REPO_DOCS_JSON = `https://${USER}.github.io/${REPO}/${SUBFOLDER}/index.json`;
        const GITHUB_API_URL = `https://api.github.com/repos/${USER}/${REPO}/contents/${SUBFOLDER}`;
        const YT_JSON_URL = 'https://raw.githubusercontent.com/cju-media/FCCLA-Youtube-Checker/main/data/playlist_streams.json';

        const viewerFrame = document.getElementById('ow-viewer');
        const statusBar = document.getElementById('status-bar');
        const watchBtn = document.getElementById('watch-service-btn');
        const openNewTabBtn = document.getElementById('open-new-tab-btn');
        const mobilePdfDeck = document.getElementById('mobile-pdf-deck');
        const mobileLoaderMsg = document.getElementById('mobile-loader-msg');
        const owDropdown = document.getElementById('ow-dropdown');

        let masterDatabase = {};
        let currentRenderTaskToken = null;

        function normalizeDate(m, d, y) {
            let month = parseInt(m, 10);
            let day = parseInt(d, 10);
            let year = parseInt(y, 10);
            if (year > 1000) year = year % 100;
            return `${month}-${day}-${year}`;
        }

        function extractCleanDateKey(filename) {
            if (filename.includes('/')) {
                filename = filename.substring(filename.lastIndexOf('/') + 1);
            }
            const match = filename.match(/^(\d{1,2})[-.](\d{1,2})[-.](\d{2,4})/);
            if (match) {
                const norm = normalizeDate(match[1], match[2], match[3]);
                return `${norm.month}-${norm.day}-${norm.year}`;
            }
            return null;
        }

        function getTargetDateKeyFromPath() {
            let dateSlug = null;

            if (window.location.protocol === 'file:') {
                const urlParams = new URLSearchParams(window.location.search);
                dateSlug = urlParams.get('date'); 
            } else {
                const path = window.location.pathname;
                const segments = path.split('/').filter(Boolean);
                const filteredSegments = segments.filter(seg => {
                    const lower = seg.toLowerCase();
                    return lower !== REPO.toLowerCase() && lower !== SUBFOLDER.toLowerCase();
                });
                if (filteredSegments.length > 0) {
                    dateSlug = filteredSegments[0];
                }
            }

            if (!dateSlug) return null;
            const match = dateSlug.match(/^(\d{1,2})[-.](\d{1,2})[-.](\d{2,4})/);
            return match ? normalizeDate(match[1], match[2], match[3]) : null;
        }

        function sortKeysChronologically(keys) {
            keys.sort((a, b) => {
                const pA = a.split('-').map(Number);
                const pB = b.split('-').map(Number);
                if (pA[2] !== pB[2]) return pB[2] - pA[2];
                if (pA[0] !== pB[0]) return pB[0] - pA[0];
                return pB[1] - pA[1];
            });
        }

        async function matchYoutubeVideo(dateKey) {
            watchBtn.style.display = 'none'; 
            if (!dateKey) return;

            const parts = dateKey.split('-').map(Number);
            const pad = (num) => String(num).padStart(2, '0');
            const targetKey = `20${pad(parts[2])}${pad(parts[0])}${pad(parts[1])}`;

            try {
                const response = await fetch(`${YT_JSON_URL}?cb=${new Date().getTime()}`, { mode: 'cors' });
                const data = await response.json();
                
                if (data && data[targetKey] && Array.isArray(data[targetKey]) && data[targetKey].length > 0) {
                    watchBtn.href = data[targetKey][0];
                    watchBtn.style.display = 'inline-block';
                }
            } catch (err) {
                console.warn('[YT Engine] Connection error loading tracking matrix metadata:', err);
            }
        }

        async function renderMobilePdfCompilation(pdfUrl) {
            const assignmentToken = Symbol('renderToken');
            currentRenderTaskToken = assignmentToken;

            mobilePdfDeck.innerHTML = '<div id="mobile-loader-msg">Downloading multi-page layout document...</div>';

            try {
                // Pass direct anonymous origin parameters to slice cleanly through custom security sandboxes
                const loadingTask = pdfjsLib.getDocument({
                    url: pdfUrl,
                    withCredentials: false
                });
                const pdf = await loadingTask.promise;
                
                if (currentRenderTaskToken !== assignmentToken) return;
                mobilePdfDeck.innerHTML = ''; 

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    if (currentRenderTaskToken !== assignmentToken) return;

                    const page = await pdf.getPage(pageNum);
                    
                    const canvas = document.createElement('canvas');
                    canvas.className = 'mobile-pdf-page-canvas';
                    mobilePdfDeck.appendChild(canvas);

                    const ctx = canvas.getContext('2d');
                    const viewport = page.getViewport({ scale: 1.5 }); // Balanced scale factor for fast mobile rendering
                    
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    const renderContext = {
                        canvasContext: ctx,
                        viewport: viewport
                    };
                    
                    await page.render(renderContext).promise;
                }
            } catch (err) {
                console.error('[Mobile PDF Engine] Crash compiling canvas layouts:', err);
                mobilePdfDeck.innerHTML = '<div id="mobile-loader-msg" style="color:#cc0000;">Unable to render document inline. Please use the "Open OW" button above.</div>';
            }
        }

        function switchOW(dateKey) {
            const fileData = masterDatabase[dateKey];
            if (!fileData) return;

            statusBar.style.display = 'none';
            openNewTabBtn.href = fileData.url;

            if (window.innerWidth <= 767) {
                renderMobilePdfCompilation(fileData.url);
            } else {
                viewerFrame.src = fileData.url + '#view=Fit';
            }

            if (window.location.protocol !== 'file:') {
                window.history.pushState(null, '', '/ows/' + dateKey);
            }
            matchYoutubeVideo(dateKey);
        }

        async function loadViewer() {
            const pathTargetKey = getTargetDateKeyFromPath();
            const cacheBuster = `?cb=${new Date().getTime()}`;
            let activeKey = null;

            try {
                if (window.location.protocol === 'file:') {
                    console.log("[Directory Engine] Local mode: query live API.");
                    const response = await fetch(`${GITHUB_API_URL}${cacheBuster}`, { mode: 'cors' });
                    const apiData = await response.json();
                    if (Array.isArray(apiData)) {
                        apiData.forEach(item => {
                            const name = item.name;
                            const match = name.match(/^(\d{1,2})[-.](\d{1,2})[-.](\d{2,4})/);
                            if (match && name.toLowerCase().endsWith('.pdf')) {
                                const k = normalizeDate(match[1], match[2], match[3]);
                                masterDatabase[k] = {
                                    filename: name,
                                    url: `https://${USER}.github.io/${REPO}/${SUBFOLDER}/${encodeURIComponent(name)}`,
                                    display_date: k.replace(/-/g, '/')
                                };
                            }
                        });
                    }
                } else {
                    console.log("[Directory Engine] Production mode: loading static database dictionary.");
                    const response = await fetch(`${REPO_DOCS_JSON}${cacheBuster}`, { mode: 'cors' });
                    masterDatabase = await response.json();
                }

                const sortedKeys = Object.keys(masterDatabase);
                sortKeysChronologically(sortedKeys);

                if (sortedKeys.length > 0) {
                    owDropdown.innerHTML = '';
                    sortedKeys.forEach(key => {
                        const option = document.createElement('option');
                        option.value = key; 
                        option.innerText = masterDatabase[key].display_date;
                        owDropdown.appendChild(option);
                    });

                    if (pathTargetKey && masterDatabase[pathTargetKey]) {
                        activeKey = pathTargetKey;
                    } else {
                        activeKey = sortedKeys[0];
                    }

                    owDropdown.value = activeKey;
                }

                if (activeKey && masterDatabase[activeKey]) {
                    switchOW(activeKey);
                } else {
                    statusBar.innerText = 'No documents found.';
                    owDropdown.innerHTML = '<option value="">No archives available</option>';
                }

            } catch (error) {
                statusBar.innerText = 'Error loading unified tracking matrix database layers.';
                console.error(error);
            }
        }

        owDropdown.addEventListener('change', function(e) {
            const selectedKey = e.target.value;
            if (selectedKey && masterDatabase[selectedKey]) {
                switchOW(selectedKey);
            }
        });

        loadViewer();
    </script>
</body>
</html>
