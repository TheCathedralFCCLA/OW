<!DOCTYPE html>
<html>
<head>
    <title>Opening OW PDF...</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #666; }
    </style>
</head>
<body>
    <div id="status">Opening OW...</div>

    <script>
        const USER = 'TheCathedralFCCLA';
        const REPO = 'OW';

        // Helper to convert URL date format "mm-dd-yyyy" to file format "MM.DD.YEAR"
        function getTargetFilenameFromPath() {
            const path = window.location.pathname;
            // Removes trailing slashes and splits the path
            const segments = path.split('/').filter(Boolean);
            
            // If the URL is just the root or repo name, there's no specific date requested
            // segments[0] might be the repo name depending on custom domain setup, adjust if needed
            const dateSlug = segments[segments.length - 1];

            // Validate if the slug looks like a date (e.g., 03-25-2026 or 3-25-2026)
            const dateRegex = /^(\d{1,2})-(\d{1,2})-(\d{4})$/;
            const match = dateSlug ? dateSlug.match(dateRegex) : null;

            if (match) {
                const [_, month, day, year] = match;
                // Pad with zeros if your files strictly use two digits, e.g., "03.25.2026 OW.pdf"
                const formattedMonth = month.padStart(2, '0');
                const formattedDay = day.padStart(2, '0');
                
                return `${formattedMonth}.${formattedDay}.${year} OW.pdf`.toLowerCase();
            }
            return null;
        }

        async function handleRedirect() {
            const statusDiv = document.getElementById('status');
            const targetFilename = getTargetFilenameFromPath();

            try {
                // Fetch the contents of the repo
                const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/`);
                const files = await response.json();

                // Filter for PDF files
                const pdfFiles = files.filter(file => file.name.toLowerCase().endsWith('.pdf'));

                if (targetFilename) {
                    // Try to find the specific requested date file
                    const matchedFile = pdfFiles.find(file => file.name.toLowerCase() === targetFilename);
                    
                    if (matchedFile) {
                        const pdfUrl = `https://${USER}.github.io/${REPO}/${matchedFile.name}`;
                        window.location.replace(pdfUrl);
                        return;
                    } else {
                        statusDiv.innerText = 'Requested date PDF not found. Redirecting to latest...';
                        // Fallback to latest if explicit date fails after a brief pause
                        await new Promise(resolve => setTimeout(resolve, 1500));
                    }
                }

                // Default behavior: Sort and pick the latest PDF
                // NOTE: If using "MM.DD.YYYY", basic alphabetical sort won't sort by year accurately.
                // This custom sort extracts the year first to ensure true chronological ordering.
                pdfFiles.sort((a, b) => {
                    const getYear = (name) => name.split('.')[2]?.split(' ')[0] || '0000';
                    const yearA = getYear(a.name);
                    const yearB = getYear(b.name);
                    
                    if (yearA !== yearB) return yearB.localeCompare(yearA); // Newest year first
                    return b.name.localeCompare(a.name); // Same year, fallback to alphabetical month/day
                });

                if (pdfFiles.length > 0) {
                    const latestPdf = pdfFiles[0];
                    const pdfUrl = `https://${USER}.github.io/${REPO}/${latestPdf.name}`;
                    window.location.replace(pdfUrl);
                } else {
                    statusDiv.innerText = 'No PDF files found.';
                }
            } catch (error) {
                statusDiv.innerText = 'Error loading PDF.';
                console.error(error);
            }
        }

        handleRedirect();
    </script>
</body>
</html>
