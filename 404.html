<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Routing Session Redirect...</title>
    <script>
        // Store the dynamic slug segment before bouncing to prevent index fallback drops
        (function() {
            var path = window.location.pathname;
            var segments = path.split('/').filter(Boolean);
            
            // Look for a date string track sequence (digits split by dashes or dots)
            var dateRegex = /(\d{1,2})[-.](\d{1,2})[-.](\d{2,4})/;
            var matchedSlug = null;
            
            for (var i = 0; i < segments.length; i++) {
                if (dateRegex.test(segments[i])) {
                    matchedSlug = segments[i];
                    break;
                }
            }
            
            if (matchedSlug) {
                console.log("[404 Routing] Preserving date target key session: " + matchedSlug);
                sessionStorage.setItem('redirect_ow_date', matchedSlug);
            }
            
            // Securely route back down to your master viewer script page track root
            window.location.replace("https://cju-media.github.io/OW/OW%20HTML/OW.html");
        })();
    </script>
</head>
<body>
    <p>Routing to document viewer workspace layers...</p>
</body>
</html>
