<!DOCTYPE html>
<html>
<head>
    <title>Opening OW PDF...</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 40px;
            color: #333; 
            background-color: #f9f9f9;
            line-height: 1.6;
        }
        .debug-box {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 20px;
            margin-top: 20px;
            font-family: monospace;
            white-space: pre-wrap;
            text-align: left;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div id="status">Processing redirection...</div>
    <div id="debug" class="debug-box">Initializing debug logs...</div>

    <script>
        const USER = 'TheCathedralFCCLA';
        const REPO = 'OW';
        const SUBFOLDER = 'OWs'; 

        function logDebug(msg) {
            document.getElementById('debug').innerText += "\n" + msg;
        }

        function getTargetFilenameFromPath() {
            const path = window.location.pathname;
            const segments = path.split('/').filter(Boolean);
            
            const filteredSegments = segments.filter(seg => {
                const lower = seg.toLowerCase();
                return lower !== REPO.toLowerCase() && lower !== SUBFOLDER.toLowerCase();
            });

            const dateSlug = filteredSegments[0];
            logDebug(`[Debug] URL Date Slug detected: "${dateSlug}"`);

            const dateRegex = /^(\d{1,2})-(\d{1,2})-(\d{2,4})$/;
            const match = dateSlug ? dateSlug.match(dateRegex) : null;

            if (match) {
                let [_, month, day, year] = match;
                month = parseInt(month, 10).toString();
                day = parseInt(day, 10).toString();
                
                if (year.length === 4) {
                    year = year.slice(-2);
                }
                
                // Constructing the target file string
                const generatedName = `${month}.${day}.${year} ow.pdf`;
                logDebug(`[Debug] Script is looking for a file named: "${generatedName}"`);
                return generatedName;
            }
            logDebug(`[Debug] URL slug did not match a date pattern.`);
            return null;
        }

        async function handleRedirect() {
            const statusDiv = document.getElementById('status');
            document.getElementById('debug').innerText = "[Debug] Starting fetch...";
            const targetFilename = getTargetFilenameFromPath();

            try {
                const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${SUBFOLDER}`);
                const files = await response.json();

                if (!Array.isArray(files)) {
                    throw new Error("Could not parse repository contents directory.");
                }

                const pdfFiles = files.filter(file => file.name.toLowerCase().endsWith('.pdf'));
                
                logDebug(`\n[Debug] Available PDFs found in your /${SUBFOLDER} folder:`);
                pdfFiles.forEach(f => logDebug(` - "${f.name.toLowerCase()}"`));

                if (targetFilename) {
                    const matchedFile = pdfFiles.find(file => file.name.toLowerCase() === targetFilename);
                    
                    if (matchedFile) {
                        logDebug(`\n[Debug] Match SUCCESSFUL! Redirecting...`);
                        const pdfUrl = `https://${USER}.github.io/${REPO}/${SUBFOLDER}/${matchedFile.name}`;
                        // Comment out the replace line temporarily if you want to read the logs on screen
                        window.location.replace(pdfUrl);
                        return;
                    } else {
                        logDebug(`\n[Debug] Match FAILED. The requested filename and the actual filename don't match exactly.`);
                        statusDiv.innerText = 'Requested date PDF not found. Checking for latest...';
                        await new Promise(resolve => setTimeout(resolve, 5000)); // 5 second pause to read logs
                    }
                }

                // Sorting fall-back
                pdfFiles.sort((a, b) => {
                    const parseDateParts = (name) => {
                        const parts = name.split(' ')[0].split('.');
                        return {
                            month: parseInt(parts[0], 10) || 0,
                            day: parseInt(parts[1], 10) || 0,
                            year: parseInt(parts[2], 10) || 0
                        };
                    };
                    const dateA = parseDateParts(a.name);
                    const dateB = parseDateParts(b.name);
                    if (dateA.year !== dateB.year) return dateB.year - dateA.year;
                    if (dateA.month !== dateB.month) return dateB.month - dateA.month;
                    return dateB.day - dateA.day;
                });

                if (pdfFiles.length > 0) {
                    const latestPdf = pdfFiles[0];
                    logDebug(`[Debug] Falling back to latest file: "${latestPdf.name}"`);
                    const pdfUrl = `https://${USER}.github.io/${REPO}/${SUBFOLDER}/${latestPdf.name}`;
                    window.location.replace(pdfUrl);
                } else {
                    statusDiv.innerText = 'No PDF files found.';
                }
            } catch (error) {
                statusDiv.innerText = 'Error loading document layout.';
                console.error(error);
            }
        }

        handleRedirect();
    </script>
</body>
</html>
